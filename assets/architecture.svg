<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Agent 通过本地 MCP 服务操作远程服务器</title>
  <desc id="desc">Agent 经 MCP 发起请求，本地应用检查授权并通过 SSH 和 SFTP 访问远程服务器，操作结果返回 Agent。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse">
      <path d="M0 0 6 3 0 6" fill="none" stroke="#5579b1" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="40" y="43" fill="#496382" font-size="13" font-weight="600" letter-spacing="2">FROM INTENT TO REMOTE ACTION</text>
    <g fill="#fff" stroke="#d8e2ef">
      <rect x="40" y="85" width="280" height="155" rx="14"/>
      <rect x="440" y="85" width="320" height="155" rx="14" stroke="#7fa2d7"/>
      <rect x="880" y="85" width="280" height="155" rx="14"/>
    </g>
    <g fill="#1d3555" font-size="22" font-weight="600" text-anchor="middle">
      <text x="180" y="126">AI Agent</text>
      <text x="600" y="126">Remote SSH Brige</text>
      <text x="1020" y="126">远程服务器</text>
    </g>
    <g fill="#526782" font-size="15" text-anchor="middle">
      <text x="180" y="162">理解任务 · 调用工具 · 验证结果</text>
      <text x="180" y="201" font-size="13">Claude Code / Codex / Cursor / …</text>
      <text x="600" y="162">本地 MCP 服务与 SSH 连接管理</text>
      <text x="600" y="201">权限检查 · 可选审批 · 操作审计</text>
      <text x="1020" y="162">文件读取与编辑 · 命令执行</text>
      <text x="1020" y="201">持久终端 · SSH 账户权限</text>
    </g>
    <g stroke="#5579b1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M338 164H422"/>
      <path d="M778 164H862"/>
    </g>
    <g fill="#3e6398" font-size="13" text-anchor="middle">
      <text x="380" y="145">MCP</text>
      <text x="820" y="145">SSH / SFTP</text>
    </g>
    <text x="600" y="290" text-anchor="middle" fill="#526782" font-size="15">你决定开放哪些能力，Agent 在授权范围内完成远程工作。</text>
  </g>
</svg>
