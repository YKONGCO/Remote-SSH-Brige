[package]
name = "remote-ssh-brige"
default-run = "remote-ssh-brige"
version = "0.4.0"
license = "MIT"
description = "Permission-controlled remote server access for AI agents over MCP and SSH"
edition = "2021"

[lib]
name = "remote_ssh_brige_lib"
crate-type = ["rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri = { version = "2", features = ["tray-icon"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
axum = "0.8"
http-body-util = "0.1"
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
anyhow = "1"
subtle = "2"
shlex = "2"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
unicode-normalization = "0.1"
similar = "2"

[[bin]]
name = "remote-ssh-brige"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "remote-ssh-brige-headless"
path = "src/bin/headless.rs"
